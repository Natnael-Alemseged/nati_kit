  cookie_jar: ^4.0.8
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.5.0
  package_info_plus: ^8.1.1
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
