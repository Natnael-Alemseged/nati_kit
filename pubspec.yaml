version: 1.0.1
homepage: https://github.com/Natnael-Alemseged/nati_kit
repository: https://github.com/Natnael-Alemseged/nati_kit

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  delightful_toast: ^1.1.0
  dio: ^5.9.0
